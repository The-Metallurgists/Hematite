modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL="https://github.com/The-Metallurgists/Hematite/issues/"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
